name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/jabin_ci?schema=public
  DIRECT_URL: postgresql://ci:ci@localhost:5432/jabin_ci?schema=public
  AUTH_SECRET: ci-auth-secret-minimum-32-characters-long
  AUTH_URL: http://localhost:3000
  ENCRYPTION_KEY: ci-encryption-key-minimum-32-chars
  GOOGLE_CLIENT_ID: ci-google-client-id
  GOOGLE_CLIENT_SECRET: ci-google-client-secret
  NODE_ENV: test
  EMAIL_PROVIDER: smtp
  SMTP_HOST: smtp.example.com
  SMTP_PORT: "587"
  SMTP_USER: ci@example.com
  SMTP_PASSWORD: ci-smtp-password
  SMTP_FROM: ci@example.com

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test -- --passWithNoTests

      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: lint-test-build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium --with-deps
      - name: E2E smoke (skipped without PLAYWRIGHT_BASE_URL)
        run: pnpm test:e2e
        env:
          CI: true
